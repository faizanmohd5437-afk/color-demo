<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Demo</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f3f7;color:#222}
.header{background:#6d28d9;color:white;padding:18px;text-align:center}
.header h1{margin:0;font-size:24px}
.container{max-width:480px;margin:auto}
.card{margin:14px;padding:18px;background:white;border-radius:16px;box-shadow:0 3px 12px #0001}
.balance{text-align:center}
.balance small{color:#777}
.balance strong{display:block;font-size:30px;margin-top:6px}
.period{text-align:center;color:#666}
.timer{text-align:center;font-size:42px;font-weight:bold;margin:12px}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button{border:0;border-radius:10px;padding:14px 4px;color:white;font-weight:bold;font-size:15px}
.red{background:#ef4444}
.green{background:#22c55e}
.violet{background:#8b5cf6}
.result{text-align:center;background:#f5f5f5;border-radius:10px;padding:14px;margin-top:15px;font-weight:bold}
h2{margin-top:0;font-size:20px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.note{text-align:center;color:#777;font-size:12px;padding:15px}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>COLOR DEMO</h1>
</div>

<div class="card balance">
<small>Virtual Balance</small>
<strong>10,000 🪙</strong>
</div>

<div class="card">

<div class="period">
Period: <b id="period">100001</b>
</div>

<div class="timer" id="timer">00:30</div>

<div class="buttons">
<button class="red" onclick="selectColor('Red')">RED</button>
<button class="green" onclick="selectColor('Green')">GREEN</button>
<button class="violet" onclick="selectColor('Violet')">VIOLET</button>
</div>

<div class="result" id="result">
Choose a colour
</div>

</div>

<div class="card">
<h2>Result History</h2>

<div id="history">
<div class="row"><span>100000</span><b>Green</b></div>
<div class="row"><span>99999</span><b>Red</b></div>
<div class="row"><span>99998</span><b>Violet</b></div>
</div>
</div>

<div class="note">
Demo version • Virtual coins only
</div>

</div>

<script>

let seconds=30;
let period=100001;

function selectColor(color){
document.getElementById("result").textContent=
"Demo selection: "+color;
}

setInterval(function(){

seconds--;

if(seconds<0){

seconds=30;
period++;

let colors=["Red","Green","Violet"];
let result=colors[Math.floor(Math.random()*colors.length)];

document.getElementById("period").textContent=period;

document.getElementById("result").textContent=
"Demo Result: "+result;

let history=document.getElementById("history");

history.innerHTML=
'<div class="row"><span>'+
period+
'</span><b>'+
result+
'</b></div>'+
history.innerHTML;

}

document.getElementById("timer").textContent=
"00:"+String(seconds).padStart(2,"0");

},1000);

</script>

</body>
</html>
