<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .header {
      background: #7c3aed;
      color: white;
      text-align: center;
      padding: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      margin: 15px;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .balance {
      text-align: center;
    }

    .balance strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    .game {
      text-align: center;
    }

    .period {
      color: #666;
    }

    .timer {
      font-size: 38px;
      font-weight: bold;
      margin: 15px 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 15px 5px;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .red {
      background: #ef4444;
    }

    .green {
      background: #22c55e;
    }

    .violet {
      background: #8b5cf6;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      background: #f3f4f6;
      border-radius: 10px;
      font-weight: bold;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COLOR DEMO</h1>
  </div>

  <div class="card balance">
    Virtual Balance
    <strong>10,000 🪙</strong>
  </div>

  <div class="card game">
    <div class="period">
      Demo Period: <span id="period">100001</span>
    </div>

    <div class="timer" id="timer">00:30</div>

    <div class="buttons">
      <button class="red" onclick="selectColor('Red')">RED</button>
      <button class="green" onclick="selectColor('Green')">GREEN</button>
      <button class="violet" onclick="selectColor('Violet')">VIOLET</button>
    </div>

    <div class="result" id="result">
      Select a colour for demo.
    </div>
  </div>

  <div class="card">
    <h2>Result History</h2>

    <div id="history">
      <div class="row">
        <span>100000</span>
        <strong>Green</strong>
      </div>

      <div class="row">
        <span>99999</span>
        <strong>Red</strong>
      </div>

      <div class="row">
        <span>99998</span>
        <strong>Violet</strong>
      </div>
    </div>
  </div>

  <div class="note">
    Demo version — virtual coins only.
  </div>

  <script>
    let seconds = 30;
    let period = 100001;

    function selectColor(color) {
      document.getElementById("result").textContent =
        "Demo selection: " + color;
    }

    setInterval(function () {
      seconds--;

      if (seconds < 0) {
        seconds = 30;
        period++;

        const colors = ["Red", "Green", "Violet"];
        const result =
          colors[Math.floor(Math.random() * colors.length)];

        document.getElementById("period").textContent = period;

        document.getElementById("result").textContent =
          "Demo Result: " + result;

        const history = document.getElementById("history");

        history.innerHTML =
          '<div class="row"><span>' +
          period +
          '</span><strong>' +
          result +
          '</strong></div>' +
          history.innerHTML;
      }

      document.getElementById("timer").textContent =
        "00:" + String(seconds).padStart(2, "0");

    }, 1000);
  </script>

</body>
</html>
